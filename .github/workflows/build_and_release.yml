name: Build & Release Executable (PyInstaller + NSIS)

on:
  push:
    tags:
      - 'v*' # Se déclenche au push d'un tag comme v1.0.0
  workflow_dispatch: # Permet de lancer la compilation manuellement depuis GitHub

jobs:
  build:
    name: Compilation Windows (Exe + Installateur NSIS)
    runs-on: windows-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Compilation de l'application avec PyInstaller
        run: |
          pyinstaller --onefile --windowed --name MSG_Windows launcher.py

      - name: Installation et Compilation de l'installateur NSIS
        run: |
          choco install nsis -y
          $nsisExe = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $nsisExe) {
              & $nsisExe installer.nsi
          } else {
              makensis installer.nsi
          }

      - name: Recherche des fichiers générés (.exe et setup)
        id: get_assets
        run: |
          Get-ChildItem -Path . -Filter "*.exe" | ForEach-Object { Write-Host "Trouvé : $($_.Name)" }

      - name: Publication automatique sur GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/MSG_Windows.exe
            MSG_Windows_Setup_v1.0.0.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
