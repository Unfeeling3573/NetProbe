name: Build & Release – NetProbe (PyInstaller)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Compilation Windows Exe (dossier compiled/)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Compilation de l'application dans le dossier compiled/
        run: |
          pyinstaller --onefile --windowed --name NetProbe --distpath compiled launcher.py

      - name: Vérification de l'exécutable généré
        run: |
          Get-ChildItem -Path compiled -Filter "*.exe" | ForEach-Object { Write-Host "Exécutable créé : $($_.FullName)" }

      - name: Publication sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.5
          name: "Release v1.1.5 – NetProbe © Hub Education"
          body: |
            ## NetProbe v1.1.5 – Patch correctif

            ### Corrections
            - Nettoyage du code mort (`_AboutMixin`)
            - Nom de l'application uniformisé : **NetProbe** partout
            - Token GitHub retiré du fichier `installer.nsi`
            - Chemin de compilation corrigé (`compiled/` au lieu de `dist/`)
            - Docstrings et titres mis à jour

            ### Téléchargement
            Téléchargez `NetProbe.exe` ci-dessous, aucune installation Python requise.

            ### Dépôt
            https://github.com/Unfeeling3573/NetProbe
          files: |
            compiled/NetProbe.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
