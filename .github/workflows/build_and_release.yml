name: Build & Release Executable (PyInstaller)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Compilation Windows Exe (Dossier compiled)
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Compilation de l'application dans le dossier compiled
        run: |
          pyinstaller --onefile --windowed --name MSG_Windows --distpath compiled launcher.py

      - name: Vérification de l'exécutable généré
        run: |
          Get-ChildItem -Path compiled -Filter "*.exe" | ForEach-Object { Write-Host "Exécutable créé : $($_.FullName)" }

      - name: Publication sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Release v1.0.0 - Hub Education"
          files: |
            compiled/MSG_Windows.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
